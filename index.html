<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuckDuckGo Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fff;
            color: #333;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 15px 20px;
            background: #fff;
            border-bottom: 1px solid #ddd;
            flex-shrink: 0;
        }

        .search-box {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #searchInput {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 24px;
            font-size: 16px;
        }

        #searchInput:focus {
            outline: none;
            border-color: #de5833;
        }

        button {
            padding: 10px 20px;
            background: #de5833;
            color: white;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #c74723;
        }

        #clearHistoryBtn {
            padding: 8px 15px;
            background: #666;
            font-size: 14px;
            min-width: auto;
        }

        #clearHistoryBtn:hover {
            background: #444;
        }

        .suggestions {
            position: absolute;
            top: 60px;
            left: 20px;
            right: 20px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 100;
            display: none;
        }

        .suggestions.active {
            display: block;
        }

        .suggestion-item {
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }

        .suggestion-item:hover {
            background: #f5f5f5;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-label {
            font-size: 12px;
            color: #999;
            font-weight: bold;
            padding: 8px 15px 4px;
            text-transform: uppercase;
        }

        #resultsContainer {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .result {
            margin-bottom: 30px;
        }

        .result-title {
            color: #1e90ff;
            font-size: 18px;
            margin-bottom: 5px;
            cursor: pointer;
        }

        .result-title:hover {
            text-decoration: underline;
        }

        .result-url {
            color: #006621;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .result-snippet {
            color: #545454;
            font-size: 15px;
            line-height: 1.6;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #666;
        }

        .error {
            color: #d32f2f;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search with DuckDuckGo..." autocomplete="off">
                <button id="searchBtn">Search</button>
                <button id="clearHistoryBtn">Clear History</button>
            </div>
            <div id="suggestions" class="suggestions"></div>
        </div>
        <div id="resultsContainer"></div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsContainer = document.getElementById('resultsContainer');
        const suggestionsContainer = document.getElementById('suggestions');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');

        // Initialize search history from localStorage
        let searchHistory = JSON.parse(localStorage.getItem('searchHistory')) || [];

        searchBtn.addEventListener('click', performSearch);
        clearHistoryBtn.addEventListener('click', clearHistory);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        // Show suggestions when typing
        searchInput.addEventListener('input', showSuggestions);
        searchInput.addEventListener('focus', showSuggestions);

        // Hide suggestions when clicking outside
        document.addEventListener('click', (e) => {
            if (e.target !== searchInput && e.target !== suggestionsContainer) {
                suggestionsContainer.classList.remove('active');
            }
        });

        function showSuggestions() {
            const query = searchInput.value.trim();
            
            if (!query) {
                // Show all history if input is empty
                displaySuggestionsHTML(searchHistory.slice().reverse());
            } else {
                // Filter history based on input
                const filtered = searchHistory.filter(item => 
                    item.toLowerCase().includes(query.toLowerCase())
                );
                displaySuggestionsHTML(filtered.slice().reverse());
            }
        }

        function displaySuggestionsHTML(suggestions) {
            if (suggestions.length === 0) {
                suggestionsContainer.classList.remove('active');
                return;
            }

            let html = '<div class="suggestion-label">Search History</div>';
            suggestions.forEach(suggestion => {
                html += `
                    <div class="suggestion-item" onclick="searchFor('${suggestion.replace(/'/g, "\\'")}')">
                        🕐 ${suggestion}
                    </div>
                `;
            });

            suggestionsContainer.innerHTML = html;
            suggestionsContainer.classList.add('active');
        }

        function searchFor(query) {
            searchInput.value = query;
            performSearch();
            suggestionsContainer.classList.remove('active');
        }

        async function performSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            // Add to search history
            if (!searchHistory.includes(query)) {
                searchHistory.push(query);
                localStorage.setItem('searchHistory', JSON.stringify(searchHistory));
            }

            resultsContainer.innerHTML = '<div class="loading">Searching...</div>';
            suggestionsContainer.classList.remove('active');

            try {
                // Using DuckDuckGo's API endpoint
                const response = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&pretty=1`, {
                    credentials: 'omit'
                });
                const data = await response.json();

                let html = '';

                // Add instant answer if available
                if (data.AbstractText) {
                    html += `
                        <div class="result">
                            <div class="result-title">${data.Heading || 'Answer'}</div>
                            <div class="result-snippet">${data.AbstractText}</div>
                            ${data.AbstractURL ? `<div class="result-url"><a href="${data.AbstractURL}" target="_blank" rel="noopener noreferrer">${data.AbstractURL}</a></div>` : ''}
                        </div>
                    `;
                }

                // Add related topics (if available)
                if (data.RelatedTopics && data.RelatedTopics.length > 0) {
                    data.RelatedTopics.forEach(topic => {
                        if (topic.FirstURL) {
                            html += `
                                <div class="result">
                                    <div class="result-title"><a href="${topic.FirstURL}" target="_blank" rel="noopener noreferrer" style="color: #1e90ff; text-decoration: none;">${topic.Text || topic.FirstURL}</a></div>
                                    ${topic.Icon ? `<img src="${topic.Icon.URL}" style="max-width: 16px; margin-right: 5px;">` : ''}
                                    <div class="result-snippet">${topic.Result || ''}</div>
                                </div>
                            `;
                        }
                    });
                }

                // Fallback: fetch from a search results proxy
                if (!html) {
                    html = await fetchWebResults(query);
                }

                resultsContainer.innerHTML = html || '<div class="error">No results found</div>';
                
            } catch (error) {
                resultsContainer.innerHTML = `<div class="error">Error performing search: ${error.message}</div>`;
            }
        }

        async function fetchWebResults(query) {
            try {
                // Using Searx API as fallback (public instance)
                const response = await fetch(`https://searx.be/search?q=${encodeURIComponent(query)}&format=json`, {
                    credentials: 'omit'
                });
                const data = await response.json();

                let html = '';
                if (data.results) {
                    data.results.slice(0, 10).forEach(result => {
                        html += `
                            <div class="result">
                                <div class="result-title"><a href="${result.url}" target="_blank" rel="noopener noreferrer" style="color: #1e90ff; text-decoration: none;">${result.title}</a></div>
                                <div class="result-url">${result.url}</div>
                                <div class="result-snippet">${result.content}</div>
                            </div>
                        `;
                    });
                }
                return html;
            } catch (error) {
                return '';
            }
        }

        function clearHistory() {
            if (confirm('Are you sure you want to clear all search history?')) {
                searchHistory = [];
                localStorage.setItem('searchHistory', JSON.stringify(searchHistory));
                suggestionsContainer.classList.remove('active');
                alert('Search history cleared');
            }
        }

        // Focus on page load
        window.addEventListener('load', () => {
            searchInput.focus();
        });
    </script>
</body>
</html>
