<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrivateSearch - DuckDuckGo Privacy Engine</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-container">
        <!-- Sidebar with History -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">🔍 Search</div>
                <button class="new-search-btn" onclick="newSearch()">+ New Search</button>
            </div>

            <div class="history-section">
                <div class="history-title">Recent Searches</div>
                <div id="historyContainer"></div>
                <button class="clear-history-btn" onclick="clearHistory()">Clear All History</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="header">
                <div class="logo-section">
                    <div class="logo">🔒 PrivateSearch</div>
                    <div class="tagline">Search powered by DuckDuckGo - Private & Anonymous</div>
                </div>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search the web privately..." autocomplete="off">
                    <button id="searchBtn">🔍 Search</button>
                </div>
            </div>

            <div id="resultsContainer">
                <div class="welcome-section">
                    <div class="welcome-icon">🛡️</div>
                    <div class="welcome-title">Search Privately</div>
                    <div class="welcome-subtitle">Anonymous search powered by DuckDuckGo</div>
                    <div class="features">
                        <div class="feature">
                            <div class="feature-icon">✓</div>
                            <div class="feature-title">No Tracking</div>
                            <div class="feature-desc">Your searches stay private</div>
                        </div>
                        <div class="feature">
                            <div class="feature-icon">✓</div>
                            <div class="feature-title">Local History</div>
                            <div class="feature-desc">History stored only on this device</div>
                        </div>
                        <div class="feature">
                            <div class="feature-icon">✓</div>
                            <div class="feature-title">Fast Results</div>
                            <div class="feature-desc">Instant search results from DuckDuckGo</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Content Viewer Modal/Frame -->
        <div id="contentViewer" class="content-viewer hidden">
            <div class="content-viewer-header">
                <button class="close-viewer" onclick="closeViewer()">← Back to Results</button>
                <div class="viewer-url" id="viewerUrl"></div>
            </div>
            <iframe id="contentFrame" class="content-frame" sandbox="allow-same-origin allow-scripts allow-popups allow-forms"></iframe>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
