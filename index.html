<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrivateSearch - DuckDuckGo Privacy Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #ffffff 100%);
            color: #333;
        }

        .main-container {
            display: grid;
            grid-template-columns: 250px 1fr;
            height: 100vh;
        }

        .sidebar {
            background: #f9f9f9;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 20px 15px;
            border-bottom: 1px solid #ddd;
            background: white;
        }

        .sidebar-title {
            font-size: 14px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .new-search-btn {
            width: 100%;
            padding: 10px;
            background: #de5833;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        .new-search-btn:hover {
            background: #c74723;
        }

        .history-section {
            padding: 15px;
            flex: 1;
            overflow-y: auto;
        }

        .history-title {
            font-size: 12px;
            font-weight: 600;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 10px;
            margin-top: 15px;
        }

        .history-item {
            padding: 10px 12px;
            margin-bottom: 5px;
            background: white;
            border: 1px solid #eee;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
        }

        .history-item:hover {
            background: #f0f0f0;
            border-color: #ddd;
        }

        .history-item-text {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-item-delete {
            color: #999;
            cursor: pointer;
            margin-left: 8px;
            font-size: 16px;
            padding: 0 4px;
        }

        .history-item-delete:hover {
            color: #d32f2f;
        }

        .clear-history-btn {
            width: 100%;
            padding: 8px;
            background: #f5f5f5;
            color: #666;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
        }

        .clear-history-btn:hover {
            background: #f0f0f0;
            color: #333;
        }

        .main-content {
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px;
            background: white;
            border-bottom: 1px solid #ddd;
            flex-shrink: 0;
        }

        .logo-section {
            margin-bottom: 15px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #222;
        }

        .tagline {
            font-size: 12px;
            color: #de5833;
            font-weight: 500;
            margin-top: 4px;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        #searchInput {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #ddd;
            border-radius: 24px;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        #searchInput:focus {
            outline: none;
            border-color: #de5833;
        }

        #searchBtn {
            padding: 12px 28px;
            background: #de5833;
            color: white;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s;
        }

        #searchBtn:hover {
            background: #c74723;
            transform: translateY(-1px);
        }

        #resultsContainer {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
        }

        .welcome-section {
            text-align: center;
            padding: 60px 20px;
        }

        .welcome-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .welcome-title {
            font-size: 28px;
            font-weight: 700;
            color: #222;
            margin-bottom: 10px;
        }

        .welcome-subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .feature {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #de5833;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .feature-icon {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .feature-title {
            font-weight: 600;
            margin-bottom: 5px;
            color: #222;
        }

        .feature-desc {
            font-size: 13px;
            color: #666;
        }

        .result {
            margin-bottom: 30px;
        }

        .result-title {
            color: #1e90ff;
            font-size: 18px;
            margin-bottom: 5px;
            cursor: pointer;
        }

        .result-title a {
            color: #1e90ff;
            text-decoration: none;
        }

        .result-title a:hover {
            text-decoration: underline;
        }

        .result-url {
            color: #006621;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .result-snippet {
            color: #545454;
            font-size: 15px;
            line-height: 1.6;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #666;
        }

        .error {
            color: #d32f2f;
            padding: 20px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Sidebar with History -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">🔍 Search</div>
                <button class="new-search-btn" onclick="newSearch()">+ New Search</button>
            </div>

            <div class="history-section">
                <div class="history-title">Recent Searches</div>
                <div id="historyContainer"></div>
                <button class="clear-history-btn" onclick="clearHistory()">Clear All History</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="header">
                <div class="logo-section">
                    <div class="logo">🔒 PrivateSearch</div>
                    <div class="tagline">Powered by DuckDuckGo - Private & Anonymous</div>
                </div>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search the web privately..." autocomplete="off">
                    <button id="searchBtn">🔍 Search</button>
                </div>
            </div>

            <div id="resultsContainer">
                <div class="welcome-section">
                    <div class="welcome-icon">🛡️</div>
                    <div class="welcome-title">Search Privately</div>
                    <div class="welcome-subtitle">Anonymous search powered by DuckDuckGo</div>
                    <div class="features">
                        <div class="feature">
                            <div class="feature-icon">✓</div>
                            <div class="feature-title">No Tracking</div>
                            <div class="feature-desc">Your searches stay private</div>
                        </div>
                        <div class="feature">
                            <div class="feature-icon">✓</div>
                            <div class="feature-title">Local History</div>
                            <div class="feature-desc">History stored only on this device</div>
                        </div>
                        <div class="feature">
                            <div class="feature-icon">✓</div>
                            <div class="feature-title">Fast Results</div>
                            <div class="feature-desc">Instant search results from DuckDuckGo</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsContainer = document.getElementById('resultsContainer');
        const historyContainer = document.getElementById('historyContainer');

        let searchHistory = JSON.parse(localStorage.getItem('privateSearchHistory')) || [];

        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        function displayHistory() {
            if (searchHistory.length === 0) {
                historyContainer.innerHTML = '<p style="text-align: center; color: #999; font-size: 13px; padding: 10px 0;">No searches yet</p>';
                return;
            }

            let html = '';
            searchHistory.slice().reverse().forEach((item, index) => {
                html += `
                    <div class="history-item">
                        <div class="history-item-text" onclick="searchFor('${item.replace(/'/g, "\\'")}'" title="${item}">${item}</div>
                        <div class="history-item-delete" onclick="deleteHistoryItem(${searchHistory.length - 1 - index})">✕</div>
                    </div>
                `;
            });
            historyContainer.innerHTML = html;
        }

        function searchFor(query) {
            searchInput.value = query;
            performSearch();
        }

        function deleteHistoryItem(index) {
            searchHistory.splice(index, 1);
            localStorage.setItem('privateSearchHistory', JSON.stringify(searchHistory));
            displayHistory();
        }

        function clearHistory() {
            if (confirm('Clear all search history?')) {
                searchHistory = [];
                localStorage.setItem('privateSearchHistory', JSON.stringify(searchHistory));
                displayHistory();
            }
        }

        function newSearch() {
            searchInput.value = '';
            searchInput.focus();
            resultsContainer.innerHTML = `
                <div class="welcome-section">
                    <div class="welcome-icon">🛡️</div>
                    <div class="welcome-title">Search Privately</div>
                    <div class="welcome-subtitle">Anonymous search powered by DuckDuckGo</div>
                    <div class="features">
                        <div class="feature">
                            <div class="feature-icon">✓</div>
                            <div class="feature-title">No Tracking</div>
                            <div class="feature-desc">Your searches stay private</div>
                        </div>
                        <div class="feature">
                            <div class="feature-icon">✓</div>
                            <div class="feature-title">Local History</div>
                            <div class="feature-desc">History stored only on this device</div>
                        </div>
                        <div class="feature">
                            <div class="feature-icon">✓</div>
                            <div class="feature-title">Fast Results</div>
                            <div class="feature-desc">Instant search results from DuckDuckGo</div>
                        </div>
                    </div>
                </div>
            `;
        }

        async function performSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            // Add to history
            if (!searchHistory.includes(query)) {
                searchHistory.push(query);
                localStorage.setItem('privateSearchHistory', JSON.stringify(searchHistory));
                displayHistory();
            }

            resultsContainer.innerHTML = '<div class="loading">🔍 Searching...</div>';

            try {
                const response = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&pretty=1`, {
                    credentials: 'omit'
                });
                const data = await response.json();

                let html = '';

                if (data.AbstractText) {
                    html += `
                        <div class="result">
                            <div class="result-title">${data.Heading || 'Answer'}</div>
                            <div class="result-snippet">${data.AbstractText}</div>
                            ${data.AbstractURL ? `<div class="result-url"><a href="${data.AbstractURL}" target="_blank" rel="noopener noreferrer">${data.AbstractURL}</a></div>` : ''}
                        </div>
                    `;
                }

                if (data.RelatedTopics && data.RelatedTopics.length > 0) {
                    data.RelatedTopics.forEach(topic => {
                        if (topic.FirstURL) {
                            html += `
                                <div class="result">
                                    <div class="result-title"><a href="${topic.FirstURL}" target="_blank" rel="noopener noreferrer">${topic.Text || topic.FirstURL}</a></div>
                                    <div class="result-snippet">${topic.Result || ''}</div>
                                </div>
                            `;
                        }
                    });
                }

                if (!html) {
                    html = await fetchWebResults(query);
                }

                resultsContainer.innerHTML = html || '<div class="error">No results found</div>';
            } catch (error) {
                resultsContainer.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        async function fetchWebResults(query) {
            try {
                const response = await fetch(`https://searx.be/search?q=${encodeURIComponent(query)}&format=json`, {
                    credentials: 'omit'
                });
                const data = await response.json();

                let html = '';
                if (data.results) {
                    data.results.slice(0, 10).forEach(result => {
                        html += `
                            <div class="result">
                                <div class="result-title"><a href="${result.url}" target="_blank" rel="noopener noreferrer">${result.title}</a></div>
                                <div class="result-url">${result.url}</div>
                                <div class="result-snippet">${result.content}</div>
                            </div>
                        `;
                    });
                }
                return html;
            } catch (error) {
                return '';
            }
        }

        window.addEventListener('load', () => {
            displayHistory();
            searchInput.focus();
        });
    </script>
</body>
</html>
