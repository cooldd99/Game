<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuckDuckGo Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fff;
            color: #333;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 15px 20px;
            background: #fff;
            border-bottom: 1px solid #ddd;
            flex-shrink: 0;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        #searchInput {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 24px;
            font-size: 16px;
        }

        #searchInput:focus {
            outline: none;
            border-color: #de5833;
        }

        button {
            padding: 10px 20px;
            background: #de5833;
            color: white;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #c74723;
        }

        #resultsContainer {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .result {
            margin-bottom: 30px;
        }

        .result-title {
            color: #1e90ff;
            font-size: 18px;
            margin-bottom: 5px;
            cursor: pointer;
        }

        .result-title:hover {
            text-decoration: underline;
        }

        .result-url {
            color: #006621;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .result-snippet {
            color: #545454;
            font-size: 15px;
            line-height: 1.6;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #666;
        }

        .error {
            color: #d32f2f;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search with DuckDuckGo..." autocomplete="off">
                <button id="searchBtn">Search</button>
            </div>
        </div>
        <div id="resultsContainer"></div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsContainer = document.getElementById('resultsContainer');

        // Prevent browser history from storing search queries
        window.addEventListener('beforeunload', () => {
            searchInput.value = '';
        });

        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        async function performSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            resultsContainer.innerHTML = '<div class="loading">Searching...</div>';

            try {
                // Using DuckDuckGo's API endpoint
                const response = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&pretty=1`, {
                    // Prevent credentials from being sent
                    credentials: 'omit'
                });
                const data = await response.json();

                let html = '';

                // Add instant answer if available
                if (data.AbstractText) {
                    html += `
                        <div class="result">
                            <div class="result-title">${data.Heading || 'Answer'}</div>
                            <div class="result-snippet">${data.AbstractText}</div>
                            ${data.AbstractURL ? `<div class="result-url"><a href="${data.AbstractURL}" target="_blank" rel="noopener noreferrer">${data.AbstractURL}</a></div>` : ''}
                        </div>
                    `;
                }

                // Add related topics (if available)
                if (data.RelatedTopics && data.RelatedTopics.length > 0) {
                    data.RelatedTopics.forEach(topic => {
                        if (topic.FirstURL) {
                            html += `
                                <div class="result">
                                    <div class="result-title"><a href="${topic.FirstURL}" target="_blank" rel="noopener noreferrer" style="color: #1e90ff; text-decoration: none;">${topic.Text || topic.FirstURL}</a></div>
                                    ${topic.Icon ? `<img src="${topic.Icon.URL}" style="max-width: 16px; margin-right: 5px;">` : ''}
                                    <div class="result-snippet">${topic.Result || ''}</div>
                                </div>
                            `;
                        }
                    });
                }

                // Fallback: fetch from a search results proxy
                if (!html) {
                    html = await fetchWebResults(query);
                }

                resultsContainer.innerHTML = html || '<div class="error">No results found</div>';
                
                // Clear input after search (prevents history storage)
                setTimeout(() => {
                    searchInput.value = '';
                }, 100);
                
            } catch (error) {
                resultsContainer.innerHTML = `<div class="error">Error performing search: ${error.message}</div>`;
                searchInput.value = '';
            }
        }

        async function fetchWebResults(query) {
            try {
                // Using Searx API as fallback (public instance)
                const response = await fetch(`https://searx.be/search?q=${encodeURIComponent(query)}&format=json`, {
                    credentials: 'omit'
                });
                const data = await response.json();

                let html = '';
                if (data.results) {
                    data.results.slice(0, 10).forEach(result => {
                        html += `
                            <div class="result">
                                <div class="result-title"><a href="${result.url}" target="_blank" rel="noopener noreferrer" style="color: #1e90ff; text-decoration: none;">${result.title}</a></div>
                                <div class="result-url">${result.url}</div>
                                <div class="result-snippet">${result.content}</div>
                            </div>
                        `;
                    });
                }
                return html;
            } catch (error) {
                return '';
            }
        }

        // Focus on page load and clear any autofill
        window.addEventListener('load', () => {
            searchInput.focus();
            searchInput.value = '';
        });

        // Use History API to prevent history entries
        window.addEventListener('popstate', (e) => {
            searchInput.value = '';
            resultsContainer.innerHTML = '';
        });
    </script>
</body>
</html>
