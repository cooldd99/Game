<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Search</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0f14;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
}

header {
    margin-top: 80px;
    text-align: center;
}

h1 {
    font-size: 42px;
    margin-bottom: 5px;
}

p {
    opacity: 0.7;
}

.search-box {
    margin-top: 30px;
    display: flex;
    width: 90%;
    max-width: 700px;
}

input {
    flex: 1;
    padding: 15px;
    font-size: 16px;
    border: none;
    outline: none;
    border-radius: 10px 0 0 10px;
}

button {
    padding: 15px 20px;
    border: none;
    background: #4f7cff;
    color: white;
    font-size: 16px;
    cursor: pointer;
    border-radius: 0 10px 10px 0;
}

button:hover {
    background: #3a66ff;
}

.shortcuts {
    margin-top: 20px;
}

.shortcuts button {
    margin: 5px;
    background: #1a2433;
    border: 1px solid #2a3a52;
    border-radius: 8px;
}

#results {
    width: 90%;
    max-width: 1000px;
    margin-top: 30px;
}

iframe {
    width: 100%;
    height: 75vh;
    border: none;
    border-radius: 12px;
}
</style>
</head>

<body>

<header>
    <h1>🔒 Nova Search</h1>
    <p>Private. Fast. No tracking.</p>
</header>

<div class="search-box">
    <input id="searchBox" placeholder="Search privately..."
    onkeydown="if(event.key==='Enter') search()">
    <button onclick="search()">Search</button>
</div>

<div class="shortcuts">
    <button onclick="quick('youtube')">YouTube</button>
    <button onclick="quick('wikipedia')">Wikipedia</button>
    <button onclick="quick('github')">GitHub</button>
    <button onclick="quick('reddit')">Reddit</button>
</div>

<div id="results"></div>

<script>
function search() {
    let q = document.getElementById("searchBox").value;
    if (!q) return;

    document.getElementById("results").innerHTML = `
        <iframe src="https://duckduckgo.com/?q=${encodeURIComponent(q)}"></iframe>
    `;
}

function quick(site) {
    let q = document.getElementById("searchBox").value || "";
    let query = site + " " + q;

    document.getElementById("results").innerHTML = `
        <iframe src="https://duckduckgo.com/?q=${encodeURIComponent(query)}"></iframe>
    `;
}
</script>

</body>
</html>
